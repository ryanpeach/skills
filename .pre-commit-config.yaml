# Workspace-root config for prek (https://prek.j178.dev).
#
# prek discovers nested .pre-commit-config.yaml files as separate "projects"
# and runs each in its own directory. Skill validation lives in the per-plugin
# configs:
#   - plugins/skill-linting/.pre-commit-config.yaml
#   - plugins/fork-maintenance/.pre-commit-config.yaml
#
# This root config only anchors the workspace; it intentionally runs no skill
# checks so skills are not validated twice (nested projects + root).
#
# NOTE: requires prek. Plain `pre-commit` only ever loads a single config and
# will NOT pick up the nested per-plugin configs.
repos: []
