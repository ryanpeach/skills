repos:
  - repo: https://github.com/agent-ecosystem/skill-validator
    rev: v1.5.6
    hooks:
      # This repo keeps skills under plugins/<plugin>/skills/, not the
      # platform default (.claude/skills/), and `check` takes a single
      # directory that is the *parent* of the skill folders. So we run the
      # generic `skill-validator` hook once per plugin's skills directory.
      - id: skill-validator
        name: skill-validator (skill-linting)
        args: ["check", "plugins/skill-linting/skills/"]
      - id: skill-validator
        name: skill-validator (fork-maintenance)
        args: ["check", "plugins/fork-maintenance/skills/"]
