name: Validate Skills
on:
  pull_request:
    paths:
      - "plugins/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install skill-validator
        run: |
          brew install agent-ecosystem/tap/skill-validator

      - name: Validate skills
        run: |
          skill-validator check --strict --emit-annotations plugins/**/skills/
          skill-validator check --strict -o markdown plugins/**/skills/ >> "$GITHUB_STEP_SUMMARY"
