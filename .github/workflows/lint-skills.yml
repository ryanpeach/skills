name: Validate Skills
on:
  pull_request:
    paths:
      - "plugins/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install skill-validator
        run: |
          brew install agent-ecosystem/tap/skill-validator

      - name: Validate skills
        run: |
          exit_code=0
          for skill_dir in plugins/*/skills/; do
            if [ -d "$skill_dir" ]; then
              echo "Validating skills in $skill_dir"
              skill-validator check --strict --emit-annotations "$skill_dir" || exit_code=$?
              skill-validator check --strict -o markdown "$skill_dir" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No skills directory found in $skill_dir, skipping."
            fi
          done
          exit $exit_code
