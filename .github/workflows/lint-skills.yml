name: Validate Skills
on:
  pull_request:
    paths:
      - "plugins/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prek discovers the per-plugin .pre-commit-config.yaml files (workspace
      # mode) and runs skill-validator against each plugin's skills/ directory.
      # This action installs prek and runs `prek run --all-files`.
      - uses: j178/prek-action@v2
